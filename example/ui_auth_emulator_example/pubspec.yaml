name: tekartik_firebase_ui_auth_emulator_example
description: Example of tekartik_firebase_ui_auth, tekartik_firebase_flutter_ui_auth and tekartik_firebase_ui_firestore on the Firebase emulators (native Firebase on web/android/ios/macos, REST on linux/windows).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ">=1.0.9"
  firebase_core: ">=4.7.0"
  firebase_auth: ">=6.6.0"
  cloud_firestore: ">=6.3.0"
  firebase_ui_localizations: ">=1.7.0"
  tekartik_firebase:
    git:
      url: https://github.com/tekartik/firebase.dart
      path: firebase
  tekartik_firebase_auth:
    git:
      url: https://github.com/tekartik/firebase_auth.dart
      path: auth
  tekartik_firebase_firestore:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore
  tekartik_firebase_flutter:
    git:
      url: https://github.com/tekartik/firebase_flutter
      path: firebase_flutter
  tekartik_firebase_auth_flutter:
    git:
      url: https://github.com/tekartik/firebase_flutter
      path: auth_flutter
  tekartik_firebase_firestore_flutter:
    git:
      url: https://github.com/tekartik/firebase_flutter
      path: firestore_flutter
  tekartik_firebase_rest:
    git:
      url: https://github.com/tekartik/firebase_rest.dart
      path: firebase_rest
  tekartik_firebase_auth_rest:
    git:
      url: https://github.com/tekartik/firebase_rest.dart
      path: auth_rest
  tekartik_firebase_firestore_rest:
    git:
      url: https://github.com/tekartik/firebase_rest.dart
      path: firestore_rest
  tekartik_firebase_ui_auth:
    git:
      url: https://github.com/tekartik/firebase_ui.dart
      path: packages/firebase_ui_auth
  tekartik_firebase_flutter_ui_auth:
    git:
      url: https://github.com/tekartik/firebase_ui.dart
      path: packages/firebase_flutter_ui_auth
  tekartik_firebase_ui_firestore:
    git:
      url: https://github.com/tekartik/firebase_ui.dart
      path: packages/firebase_ui_firestore

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=6.0.0"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter
  dev_build: ">=1.1.7+3"
  path: ">=1.9.1"
  process_run: ">=1.2.4"
  test: ">=1.31.0"
  tekartik_app_flutter_idb:
    git:
      url: https://github.com/tekartik/app_flutter_utils.dart
      path: app_idb
  tekartik_firebase_local:
    git:
      url: https://github.com/tekartik/firebase.dart
      path: firebase_local
  tekartik_firebase_auth_sdb:
    git:
      url: https://github.com/tekartik/firebase_auth.dart
      path: auth_sdb
  tekartik_firebase_firestore_sembast:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore_sembast
  # tool/start_emulator.dart
  tekartik_firebase_tools_common:
    git:
      url: https://github.com/tekartik/firebase_tools.dart
      path: packages/firebase_tools_common

flutter:
  uses-material-design: true
resolution: workspace
